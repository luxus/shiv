# Windows release builds carry the C runtime, so the portable exe runs without
# the Visual C++ redistributable. advapi32: unrar's bundled C++ calls WinCrypt
# (CryptAcquireContextW and friends) for its randomness; the release binary
# culls that call path under fat LTO, debug test binaries do not, and the
# symbols stay unresolved unless the library is named on the link line.
[target.x86_64-pc-windows-msvc]
rustflags = [
  "-C", "target-feature=+crt-static",
  "-C", "link-args=advapi32.lib",
]

# Local macOS builds. Apple's cc (`/usr/bin/cc`) must drive the final link:
# a GCC on PATH (nix, homebrew) links its own libstdc++ runtime, which the SDK
# has no copy of. unrar-sys compiles its C++ without linking a stdlib
# (`cpp_link_stdlib(None)`), so libc++ is spelled out here; its objects are
# built with Apple clang when `CC`/`CXX` point at it too.
[target.'cfg(target_os = "macos")']
linker = "/usr/bin/cc"
rustflags = ["-C", "link-args=-lc++"]
