name: CI

on:
  push:
    branches: [main]
    # A commit that touches only prose needs no gates; anything else —
    # code, workflows, pack data — runs them.
    paths-ignore: ["**.md", "docs/**"]
  pull_request:
    paths-ignore: ["**.md", "docs/**"]
  # A fork does not run push workflows until Actions is enabled in its
  # Actions tab; dispatch makes the suite runnable by hand either way.
  workflow_dispatch:

# A newer push or PR update supersedes the run already in flight for the
# same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          # A red run still caches its build; the next round of a fix
          # starts warm instead of compiling every dependency again.
          cache-on-failure: true
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Script tests
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Test
        run: cargo test --workspace

  windows:
    # The updater's Windows shapes (portable swap, Inno install) must
    # compile and test where they run; the release workflow already
    # builds on this image.
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@bc2d2e71bd35c5549942babaa51a89c586b981d1 # v2.8.1
        with:
          cache-on-failure: true
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace
