name: Release

# Pushing a tag like v0.1.0 builds the AppImage, Flatpak and Windows files
# and publishes a GitHub release with a changelog generated from the
# conventional commits between the last two tags (cliff.toml).
# workflow_dispatch on a v* tag publishes the same way. The CompLock watch
# does that, because a tag it pushes with GITHUB_TOKEN does not start this
# workflow. Dispatch on a branch builds the artifacts and does not publish.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Pinned and verified below. Bump together when updating the tools.
  LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/1-alpha-20250213-2/linuxdeploy-x86_64.AppImage
  LINUXDEPLOY_SHA256: 4648f278ab3ef31f819e67c30d50f462640e5365a77637d7e6f2ad9fd0b4522a
  APPIMAGE_PLUGIN_URL: https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
  APPIMAGE_PLUGIN_SHA256: 49d6a17160675a6bd1781699aae6bdf7692d98552e02a3671d2183d10547842e
  FLATPAK_CARGO_GENERATOR_URL: https://raw.githubusercontent.com/flatpak/flatpak-builder-tools/9d86d336a39b9af38b86f114b6ce5820fe260f91/cargo/flatpak-cargo-generator.py
  FLATPAK_CARGO_GENERATOR_SHA256: 0a2db6be87d75910facef28ab46d4d6460802e8419ab850d0caa6a364d26b380
  GIT_CLIFF_URL: https://github.com/orhun/git-cliff/releases/download/v2.14.2/git-cliff-2.14.2-x86_64-unknown-linux-gnu.tar.gz
  GIT_CLIFF_SHA256: 24f397c733add5390fdceee3a2088588ab0d5f944ce00d34cb7029b888cf2db4

jobs:
  appimage:
    # An old glibc, so the AppImage also runs on older distributions.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libxkbcommon-x11-0 libwayland-dev pkg-config librsvg2-bin
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: Install linuxdeploy
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/linuxdeploy" "$LINUXDEPLOY_URL"
          curl -fsSL -o "$HOME/bin/linuxdeploy-plugin-appimage" "$APPIMAGE_PLUGIN_URL"
          echo "$LINUXDEPLOY_SHA256  $HOME/bin/linuxdeploy" | sha256sum -c -
          echo "$APPIMAGE_PLUGIN_SHA256  $HOME/bin/linuxdeploy-plugin-appimage" | sha256sum -c -
          chmod +x "$HOME/bin/"*
          echo "$HOME/bin" >> "$GITHUB_PATH"
      - name: Build the AppImage
        env:
          # The runner has no FUSE: let the tools unpack themselves instead.
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: |
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          packaging/build-appimage.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*

  flatpak:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install flatpak tooling
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends flatpak flatpak-builder librsvg2-common
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
      - name: Fetch the cargo source generator
        run: |
          curl -fsSL -o "$RUNNER_TEMP/flatpak-cargo-generator.py" "$FLATPAK_CARGO_GENERATOR_URL"
          echo "$FLATPAK_CARGO_GENERATOR_SHA256  $RUNNER_TEMP/flatpak-cargo-generator.py" | sha256sum -c -
      - name: Build the Flatpak
        run: |
          version=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          FLATPAK_CARGO_GENERATOR="$RUNNER_TEMP/flatpak-cargo-generator.py" packaging/build-flatpak.sh "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: flatpak
          path: dist/*

  windows:
    runs-on: windows-2022
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: Build
        run: cargo build --release -p shiv-ui
      - name: Package
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/shiv-ui/Cargo.toml | head -1)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then version="${GITHUB_REF_NAME#v}"; fi
          mkdir -p dist
          cp target/release/shiv.exe "dist/Shiv-$version-x64-portable.exe"
          if ! command -v iscc >/dev/null; then choco install innosetup -y --no-progress; fi
          iscc="$(command -v iscc || echo '/c/Program Files (x86)/Inno Setup 6/ISCC.exe')"
          MSYS2_ARG_CONV_EXCL="*" "$iscc" "/DAppVersion=$version" packaging/windows/shiv.iss
          cd dist
          for f in *.exe; do sha256sum "$f" > "$f.sha256"; done
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [appimage, flatpak, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # Full history: git-cliff reads the commits between the last two tags.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install git-cliff
        run: |
          mkdir -p "$RUNNER_TEMP/git-cliff"
          curl -fsSL -o "$RUNNER_TEMP/git-cliff.tar.gz" "$GIT_CLIFF_URL"
          echo "$GIT_CLIFF_SHA256  $RUNNER_TEMP/git-cliff.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/git-cliff.tar.gz" -C "$RUNNER_TEMP/git-cliff" --strip-components=1
          "$RUNNER_TEMP/git-cliff/git-cliff" --version
      - name: Generate the changelog
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          "$RUNNER_TEMP/git-cliff/git-cliff" --latest --strip header > "$notes"
          # Fail closed: a release whose commits produced no changelog
          # sections (the 0.5.1 bug) is not published.
          grep -q '^## ' "$notes"
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "Shiv ${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.md"
