name: CompLock watch

# Daily: fetch deadlockconfig.com's pack-data and validate it with Shiv's typed
# model (`complock_watch`: parse, every named pak present, every part
# downloaded/unpacked/CRC-checked). Valid compatible updates refresh the
# rolling `complock-data` prerelease (`pack-data.json`, `meta.json`,
# `SHA256SUMS`) and commit `crates/shiv-core/assets/` when `model <= HEAD MODEL_LEVEL`.
# Updates that introduce or drop keys/options bump `model` in `meta.json` and
# publish to `complock-data` without touching `assets/` or bumping the Shiv app
# version. An issue opens when `model` awaits a supporting Shiv release or when
# hard validation fails.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      simulate:
        description: "Break or bump the fresh data on purpose to prove the watch paths"
        required: false
        default: none
        type: choice
        options:
          - none
          - needs-shiv
          - bad-crc
          - missing-pak

permissions:
  contents: write
  issues: write

concurrency:
  group: complock-watch
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ISSUE_TITLE: "complock watch: the upstream update does not apply"
  ISSUE_LABEL: complock-watch

jobs:
  watch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the site's pack-data and its parts
        env:
          SIMULATE: ${{ inputs.simulate || 'none' }}
        run: |
          mkdir -p "$RUNNER_TEMP/complock/parts"
          python3 - << 'PY'
          import json, os, pathlib, re, urllib.error, urllib.request

          out = pathlib.Path(os.environ["RUNNER_TEMP"], "complock")
          agent = {"User-Agent": "shiv-complock-watch"}
          html = urllib.request.urlopen(
              urllib.request.Request("https://deadlockconfig.com/", headers=agent), timeout=30
          ).read().decode()
          m = re.search(r'<script[^>]*id="pack-data"[^>]*>(.*?)</script>', html, re.S)
          assert m, "the site carries no pack-data script"
          raw_pack = m.group(1)
          data = json.loads(raw_pack)
          game = str(data.get("game", ""))
          assert game.isdigit(), "the site names no game build"

          simulate = os.environ["SIMULATE"]
          if simulate == "needs-shiv":
              data["option"][0]["simulated_key"] = True
          elif simulate == "bad-crc":
              first = next(iter(data["files"].values()))
              first["parts"][0]["crc"] ^= 1
          elif simulate == "missing-pak":
              card = next(o for o in data["option"] if "pak" in o)
              data["files"].pop(card["pak"], None)

          if simulate == "none":
              (out / "pack-data.json").write_bytes(raw_pack.encode("utf-8"))
          else:
              (out / "pack-data.json").write_text(json.dumps(data), encoding="utf-8")

          options = {k: v for k, v in data.items() if k != "gameinfo"}
          (out / "gameinfo.gi").write_text(data.get("gameinfo", ""), encoding="utf-8")
          (out / "options.json").write_text(json.dumps(options, indent=1) + "\n", encoding="utf-8")
          (out / "game").write_text(game, encoding="utf-8")

          failed = []
          seen = set()
          seen_names = set()
          for pak in options.get("files", {}).values():
              for part in pak.get("parts", []):
                  urls = part.get("url") or []
                  for url in urls if isinstance(urls, list) else [urls]:
                      if url in seen:
                          continue
                      seen.add(url)
                      if not isinstance(url, str) or not url.startswith("/") or url.startswith("//"):
                          failed.append(f"- `{url}`: refused non-relative part URL")
                          continue
                      name = url.rsplit("/", 1)[-1]
                      if not name or name in (".", "..") or "\\" in name or name in seen_names:
                          failed.append(f"- `{url}`: refused unsafe or duplicate part filename")
                          continue
                      seen_names.add(name)
                      dest = out / "parts" / name
                      try:
                          req = urllib.request.Request("https://deadlockconfig.com" + url, headers=agent)
                          dest.write_bytes(urllib.request.urlopen(req, timeout=120).read())
                      except (urllib.error.URLError, OSError) as e:
                          failed.append(f"- `{url}`: {e}")
          (out / "downloads.md").write_text("\n".join(failed) + ("\n" if failed else ""), encoding="utf-8")
          print(f"pack-data build {game}, {len(options.get('option', []))} options, {len(seen)} part urls, {len(failed)} failed")
          PY
      - name: Download previous complock-data baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          t="$RUNNER_TEMP/complock"
          mkdir -p "$t/prev"
          if gh release download complock-data -p meta.json -p pack-data.json -D "$t/prev" 2>/dev/null \
              && [ -f "$t/prev/pack-data.json" ]; then
            python3 scripts/complock_artifact.py extract-options \
              "$t/prev/pack-data.json" "$t/prev/options.json"
            echo "options=$t/prev/options.json" >> "$GITHUB_OUTPUT"
            echo "prev_meta=$t/prev/meta.json" >> "$GITHUB_OUTPUT"
          else
            echo "options=crates/shiv-core/assets/complock-options.json" >> "$GITHUB_OUTPUT"
            echo "prev_meta=" >> "$GITHUB_OUTPUT"
          fi
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: Check with Shiv's own model
        id: check
        env:
          BASELINE_OPTIONS: ${{ steps.baseline.outputs.options }}
        run: |
          t="$RUNNER_TEMP/complock"
          set +e
          cargo run --release -p shiv-core --example complock_watch -- \
            "$t/options.json" "$t/gameinfo.gi" "$BASELINE_OPTIONS" \
            "$t/parts" "$t/report.md"
          code=$?
          set -e
          cat "$t/downloads.md" >> "$t/report.md" 2>/dev/null || true
          if [ -s "$t/downloads.md" ] || [ "$code" -eq 1 ]; then
            {
              echo "valid=false"
              echo "model_bumped=false"
            } >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            {
              echo "valid=true"
              echo "model_bumped=false"
            } >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 3 ]; then
            {
              echo "valid=true"
              echo "model_bumped=true"
            } >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - name: Assemble artifact
        id: assemble
        if: steps.check.outputs.valid == 'true'
        env:
          MODEL_BUMPED: ${{ steps.check.outputs.model_bumped }}
          PREV_META: ${{ steps.baseline.outputs.prev_meta }}
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/complock"
          args=(
            --pack-data "$t/pack-data.json"
            --game "$(tr -d '[:space:]' < "$t/game")"
            --fetched "$(date -u +%F)"
            --head-complock crates/shiv-core/src/complock.rs
            --repo .
            --model-bumped "$MODEL_BUMPED"
            --out-dir "$t/artifact"
            --assets-meta crates/shiv-core/assets/complock.json
          )
          if [ -n "$PREV_META" ] && [ -f "$PREV_META" ]; then
            args+=(--prev-meta "$PREV_META")
          fi
          python3 scripts/complock_artifact.py assemble "${args[@]}" >> "$GITHUB_OUTPUT"
      - name: Upload workflow artifact
        if: steps.check.outputs.valid == 'true' && ((inputs.simulate || 'none') != 'none' || github.ref != 'refs/heads/main')
        uses: actions/upload-artifact@v4
        with:
          name: complock-artifact
          path: ${{ runner.temp }}/complock/artifact
      - name: Publish complock-data prerelease
        id: publish
        if: steps.check.outputs.valid == 'true' && (inputs.simulate || 'none') == 'none' && github.ref == 'refs/heads/main' && steps.assemble.outputs.publish_needed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL: ${{ steps.assemble.outputs.model }}
          REQUIRES_SHIV: ${{ steps.assemble.outputs.requires_shiv }}
          SOURCE_SHA256: ${{ steps.assemble.outputs.source_sha256 }}
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/complock"
          game=$(tr -d '[:space:]' < "$t/game")
          notes="CompLock pack-data build ${game}, model ${MODEL}"
          if [ -n "$REQUIRES_SHIV" ]; then
            notes="${notes}, requires Shiv >= ${REQUIRES_SHIV}"
          else
            notes="${notes}, requires unreleased Shiv support"
          fi
          notes="${notes} (source_sha256: ${SOURCE_SHA256})."
          if gh release view complock-data >/dev/null 2>&1; then
            gh release edit complock-data --prerelease --latest=false --notes "$notes"
            gh release upload complock-data --clobber \
              "$t/artifact/pack-data.json" \
              "$t/artifact/meta.json" \
              "$t/artifact/SHA256SUMS"
          else
            gh release create complock-data \
              --prerelease \
              --latest=false \
              --title "CompLock Pack Data" \
              --notes "$notes" \
              "$t/artifact/pack-data.json" \
              "$t/artifact/meta.json" \
              "$t/artifact/SHA256SUMS"
          fi
      - name: Embed compatible assets
        id: embed
        if: steps.check.outputs.valid == 'true' && (inputs.simulate || 'none') == 'none'
        env:
          ASSETS_COMPATIBLE: ${{ steps.assemble.outputs.assets_compatible }}
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/complock"
          game=$(tr -d '[:space:]' < "$t/game")
          pack_changed=false
          if [ "$ASSETS_COMPATIBLE" = "true" ]; then
            cp "$t/gameinfo.gi" crates/shiv-core/assets/complock-gameinfo.gi
            cp "$t/options.json" crates/shiv-core/assets/complock-options.json
            if ! git diff --quiet -- crates/shiv-core/assets/complock-gameinfo.gi crates/shiv-core/assets/complock-options.json; then
              pack_changed=true
            fi
            python3 -c '
          import json, pathlib, sys
          art_meta = json.loads(pathlib.Path(sys.argv[1]).read_text())
          asset_path = pathlib.Path("crates/shiv-core/assets/complock.json")
          cur_asset = json.loads(asset_path.read_text()) if asset_path.is_file() else {}
          fetched = art_meta["fetched"] if sys.argv[2] == "true" else cur_asset.get("fetched", art_meta["fetched"])
          asset_meta = {
              "schema": art_meta["schema"],
              "model": art_meta["model"],
              "requires_shiv": art_meta["requires_shiv"],
              "game": art_meta["game"],
              "fetched": fetched,
              "source": art_meta["source"],
          }
          asset_path.write_text(json.dumps(asset_meta, indent=2) + "\n", encoding="utf-8")
          ' "$t/artifact/meta.json" "$pack_changed"
          fi
          if git diff --quiet -- crates/shiv-core/assets; then
            echo "The embedded CompLock assets are current."
            exit 0
          fi
          subject="chore(complock): gameinfo build ${game} (deadlockconfig.com)"
          git config user.name "shiv-complock-watch"
          git config user.email "actions@users.noreply.github.com"
          git add crates/shiv-core/assets
          git commit -m "$subject"
          git push
      - name: Open, update or close the watch issue
        if: always() && steps.check.outputs.valid != '' && steps.publish.outcome != 'failure' && steps.embed.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          VALID: ${{ steps.check.outputs.valid }}
          MODEL: ${{ steps.assemble.outputs.model }}
          HEAD_MODEL: ${{ steps.assemble.outputs.head_model }}
          REQUIRES_SHIV: ${{ steps.assemble.outputs.requires_shiv }}
        run: |
          t="$RUNNER_TEMP/complock"
          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          open=$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')
          if [ "$VALID" = "true" ] && [ -z "$REQUIRES_SHIV" ] && [ "${MODEL:-0}" -gt "${HEAD_MODEL:-0}" ]; then
            digest=$(printf '%s\n%s' "$MODEL" "$(cat "$t/report.md" 2>/dev/null || true)" | sha256sum | cut -c1-16)
            body=$(printf '%s\n\nmodel %s needs Shiv support (build %s). The watch published the artifact without embedding incompatible assets.\n\n%s\n\nRun: %s\n' \
              "<!-- complock-watch:$digest -->" "$MODEL" "$(cat "$t/game")" "$(cat "$t/report.md" 2>/dev/null || true)" "$run")
            if [ -z "$open" ]; then
              gh label create "$ISSUE_LABEL" --color d93f0b --description "The CompLock watch could not apply an upstream update" 2>/dev/null || true
              gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$body"
            else
              seen=$(gh issue view "$open" --json body,comments --jq '[.body] + [.comments[].body] | map(select(contains("complock-watch:"))) | last')
              if printf '%s' "$seen" | grep -q "complock-watch:$digest"; then
                echo "Issue #$open already reports model $MODEL."
              else
                gh issue comment "$open" --body "$body"
              fi
            fi
            exit 0
          fi
          if [ "$VALID" = "true" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "The watch is green again: $run"
            fi
            exit 0
          fi
          digest=$(sha256sum "$t/report.md" | cut -c1-16)
          body=$(printf '%s\n\nThe daily watch did not publish the site'"'"'s update (build %s). What failed:\n\n%s\n\nRun: %s\n' \
            "<!-- complock-watch:$digest -->" "$(cat "$t/game")" "$(cat "$t/report.md")" "$run")
          if [ -z "$open" ]; then
            gh label create "$ISSUE_LABEL" --color d93f0b --description "The CompLock watch could not apply an upstream update" 2>/dev/null || true
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$body"
            exit 0
          fi
          seen=$(gh issue view "$open" --json body,comments --jq '[.body] + [.comments[].body] | map(select(contains("complock-watch:"))) | last')
          if printf '%s' "$seen" | grep -q "complock-watch:$digest"; then
            echo "Issue #$open already reports this failure."
          else
            gh issue comment "$open" --body "$body"
          fi
      - name: Fail when pack check failed
        if: steps.check.outputs.valid == 'false'
        run: exit 1
