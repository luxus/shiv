name: CompLock watch

# Daily: fetch deadlockconfig.com's pack-data, check it with the same typed
# model Shiv uses (shiv-core's complock_watch example: parse, every named
# pak present, key and option sets unchanged against the last good embed,
# every part downloaded, unpacked and CRC-checked), then either embed it —
# their gameinfo.gi, its build number and the options data (the pack-data
# minus the gameinfo text) — or open one issue saying why not (#20). The
# issue closes itself on the next green run.
#
# On main, a commit that changes the embedded pack also cuts one patch
# release. scripts/data_release.py owns that decision. The watch tags the
# commit and runs release.yml on that tag with workflow_dispatch: a
# GITHUB_TOKEN push does not start other workflows, so the tag push is not
# the trigger. The same pack on a later run does not bump, tag, or dispatch.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      simulate:
        description: "Break the fresh data on purpose to prove the red path (none, new-key, bad-crc, missing-pak)"
        required: false
        default: none

permissions:
  contents: write
  issues: write
  actions: write

concurrency:
  group: complock-watch
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  ISSUE_TITLE: "complock watch: the upstream update does not apply"
  ISSUE_LABEL: complock-watch

jobs:
  watch:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch the site's pack-data and its parts
        env:
          SIMULATE: ${{ inputs.simulate || 'none' }}
        run: |
          mkdir -p "$RUNNER_TEMP/complock/parts"
          python3 - << 'PY'
          import json, os, pathlib, re, urllib.error, urllib.request

          out = pathlib.Path(os.environ["RUNNER_TEMP"], "complock")
          agent = {"User-Agent": "shiv-complock-watch"}
          html = urllib.request.urlopen(
              urllib.request.Request("https://deadlockconfig.com/", headers=agent), timeout=30
          ).read().decode()
          m = re.search(r'<script[^>]*id="pack-data"[^>]*>(.*?)</script>', html, re.S)
          assert m, "the site carries no pack-data script"
          data = json.loads(m.group(1))
          game = str(data.get("game", ""))
          assert game.isdigit(), "the site names no game build"
          options = {k: v for k, v in data.items() if k != "gameinfo"}

          simulate = os.environ["SIMULATE"]
          if simulate == "new-key":
              options["option"][0]["simulated_key"] = True
          elif simulate == "bad-crc":
              first = next(iter(options["files"].values()))
              first["parts"][0]["crc"] ^= 1
          elif simulate == "missing-pak":
              card = next(o for o in options["option"] if "pak" in o)
              options["files"].pop(card["pak"], None)

          (out / "gameinfo.gi").write_text(data.get("gameinfo", ""))
          (out / "options.json").write_text(json.dumps(options, indent=1) + "\n")
          (out / "game").write_text(game)

          failed = []
          seen = set()
          for pak in options.get("files", {}).values():
              for part in pak.get("parts", []):
                  urls = part.get("url") or []
                  for url in urls if isinstance(urls, list) else [urls]:
                      if url in seen:
                          continue
                      seen.add(url)
                      dest = out / "parts" / url.rsplit("/", 1)[-1]
                      try:
                          req = urllib.request.Request("https://deadlockconfig.com" + url, headers=agent)
                          dest.write_bytes(urllib.request.urlopen(req, timeout=120).read())
                      except (urllib.error.URLError, OSError) as e:
                          failed.append(f"- `{url}`: {e}")
          (out / "downloads.md").write_text("\n".join(failed) + ("\n" if failed else ""))
          print(f"pack-data build {game}, {len(options.get('option', []))} options, {len(seen)} part urls, {len(failed)} failed")
          PY
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - name: Check with Shiv's own model
        id: check
        run: |
          t="$RUNNER_TEMP/complock"
          set +e
          cargo run --release -p shiv-core --example complock_watch -- \
            "$t/options.json" "$t/gameinfo.gi" crates/shiv-core/assets/complock-options.json \
            "$t/parts" "$t/report.md"
          code=$?
          set -e
          cat "$t/downloads.md" >> "$t/report.md" 2>/dev/null || true
          if [ "$code" -eq 0 ] && [ ! -s "$t/downloads.md" ]; then
            echo "green=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -le 1 ]; then
            echo "green=false" >> "$GITHUB_OUTPUT"
          else
            exit "$code"
          fi
      - name: Embed the update
        id: embed
        if: steps.check.outputs.green == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/complock"
          cp "$t/gameinfo.gi" crates/shiv-core/assets/complock-gameinfo.gi
          cp "$t/options.json" crates/shiv-core/assets/complock-options.json
          game=$(tr -d '[:space:]' < "$t/game")
          printf '{\n  "game": "%s",\n  "fetched": "%s"\n}\n' "$game" "$(date -u +%F)" \
            > crates/shiv-core/assets/complock.json
          git config user.name "shiv-complock-watch"
          git config user.email "actions@users.noreply.github.com"
          assets_changed=true
          if git diff --quiet -- crates/shiv-core/assets/complock-gameinfo.gi crates/shiv-core/assets/complock-options.json; then
            git checkout -- crates/shiv-core/assets
            assets_changed=false
          fi
          if [ "${GITHUB_REF:-}" != "refs/heads/main" ]; then
            if [ "$assets_changed" = false ]; then
              echo "The embedded CompLock data is current."
              exit 0
            fi
            git add crates/shiv-core/assets
            git commit -m "chore(complock): gameinfo build ${game} (deadlockconfig.com)"
            git push
            exit 0
          fi
          version=$(python3 scripts/data_release.py read-version crates/shiv-ui/Cargo.toml)
          tag_exists=false
          if git rev-parse -q --verify "refs/tags/v${version}" >/dev/null; then
            tag_exists=true
          fi
          release_exists=false
          if gh release view "v${version}" >/dev/null 2>&1; then
            release_exists=true
          fi
          marker=$(python3 scripts/data_release.py marker "$version")
          head_pending=false
          if git log -1 --format=%B | grep -F -q "$marker"; then
            head_pending=true
          fi
          tag_is_data_release=false
          if [ "$tag_exists" = true ] && git log -1 --format=%B "v${version}" | grep -F -q "$marker"; then
            tag_is_data_release=true
          fi
          dispatch_settled=false
          if [ "$tag_exists" = true ]; then
            sha=$(git rev-parse "v${version}^{}")
            count=$(gh run list --workflow release.yml --limit 50 \
              --json headSha,event,status,conclusion \
              --jq "[.[] | select(.headSha==\"${sha}\" and .event==\"workflow_dispatch\" and (.status==\"requested\" or .status==\"queued\" or .status==\"in_progress\" or .status==\"waiting\" or .status==\"pending\" or .conclusion==\"success\"))] | length")
            if [ -z "$count" ]; then
              echo "could not read release workflow runs" >&2
              exit 2
            fi
            if [ "$count" != "0" ]; then
              dispatch_settled=true
            fi
          fi
          plan=$(python3 scripts/data_release.py plan \
            --assets-changed "$assets_changed" \
            --version "$version" \
            --tag-exists "$tag_exists" \
            --release-exists "$release_exists" \
            --dispatch-settled "$dispatch_settled" \
            --head-pending "$head_pending" \
            --tag-is-data-release "$tag_is_data_release")
          echo "release plan: ${plan}"
          case "$plan" in
            skip)
              echo "No CompLock release."
              exit 0
              ;;
            commit\ *)
              release_version=${plan#commit }
              python3 scripts/data_release.py apply \
                --from "$version" \
                --to "$release_version" \
                --date "$(date -u +%F)" \
                --summary "CompLock pack data from deadlockconfig.com, gameinfo build ${game}." \
                --cargo crates/shiv-ui/Cargo.toml \
                --lock Cargo.lock \
                --metainfo packaging/flatpak/io.github.Siebe_Uy.shiv.metainfo.xml
              release_marker=$(python3 scripts/data_release.py marker "$release_version")
              git add \
                crates/shiv-core/assets \
                crates/shiv-ui/Cargo.toml \
                Cargo.lock \
                packaging/flatpak/io.github.Siebe_Uy.shiv.metainfo.xml
              git commit \
                -m "chore(complock): gameinfo build ${game} (deadlockconfig.com)" \
                -m "$release_marker"
              git push
              git tag "v${release_version}"
              git push origin "refs/tags/v${release_version}"
              gh workflow run release.yml --ref "v${release_version}"
              ;;
            tag\ *)
              release_version=${plan#tag }
              git tag "v${release_version}"
              git push origin "refs/tags/v${release_version}"
              gh workflow run release.yml --ref "v${release_version}"
              ;;
            dispatch\ *)
              release_version=${plan#dispatch }
              gh workflow run release.yml --ref "v${release_version}"
              ;;
            *)
              echo "unknown release plan: ${plan}" >&2
              exit 2
              ;;
          esac
      - name: Open, update or close the watch issue
        if: always() && steps.check.outputs.green != '' && steps.embed.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GREEN: ${{ steps.check.outputs.green }}
        run: |
          t="$RUNNER_TEMP/complock"
          run="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          open=$(gh issue list --label "$ISSUE_LABEL" --state open --json number --jq '.[0].number // empty')
          if [ "$GREEN" = "true" ]; then
            if [ -n "$open" ]; then
              gh issue close "$open" --comment "The watch is green again: $run"
            fi
            exit 0
          fi
          digest=$(sha256sum "$t/report.md" | cut -c1-16)
          body=$(printf '%s\n\nThe daily watch did not embed the site'"'"'s update (build %s). What failed:\n\n%s\n\nRun: %s\n' \
            "<!-- complock-watch:$digest -->" "$(cat "$t/game")" "$(cat "$t/report.md")" "$run")
          if [ -z "$open" ]; then
            gh label create "$ISSUE_LABEL" --color d93f0b --description "The CompLock watch could not apply an upstream update" 2>/dev/null || true
            gh issue create --title "$ISSUE_TITLE" --label "$ISSUE_LABEL" --body "$body"
            exit 0
          fi
          seen=$(gh issue view "$open" --json body,comments --jq '[.body] + [.comments[].body] | map(select(contains("complock-watch:"))) | last')
          if printf '%s' "$seen" | grep -q "complock-watch:$digest"; then
            echo "Issue #$open already reports this failure."
          else
            gh issue comment "$open" --body "$body"
          fi
