name: perf

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libfontconfig1-dev libxkbcommon-dev libwayland-dev pkg-config
      - name: Rust toolchain
        run: rustup show active-toolchain
      - name: Resolve the bench comparison base
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_BASE_SHA" ]; then
            base="$PR_BASE_SHA"
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "${EVENT_BEFORE}^{commit}" 2>/dev/null; then
            base="$EVENT_BEFORE"
          else
            base="${HEAD_SHA}^"
          fi
          echo "BENCH_BASE=$base" >> "$GITHUB_ENV"
          echo "BENCH_HEAD=$HEAD_SHA" >> "$GITHUB_ENV"
      - name: Bench the comparison base, saving the criterion baseline
        # tempfile honours TMPDIR: the benches' temp addons folders sit on
        # tmpfs, so the runner disk's write jitter is not in either arm.
        env:
          TMPDIR: /dev/shm
        run: |
          git checkout --detach "$BENCH_BASE"
          cargo bench -p shiv-core --bench reorder \
            -- --warm-up-time 2 --measurement-time 2 --save-baseline push \
            | tee "$RUNNER_TEMP/reorder-base.log"
          cargo bench -p shiv-api --bench catalog \
            -- --warm-up-time 2 --measurement-time 2 --save-baseline push \
            | tee "$RUNNER_TEMP/catalog-base.log"
      - name: Bench the pushed tree against the saved baseline
        env:
          TMPDIR: /dev/shm
        run: |
          git checkout --detach "$BENCH_HEAD"
          cargo bench -p shiv-core --bench reorder \
            -- --warm-up-time 2 --measurement-time 2 --baseline-lenient push \
            | tee "$RUNNER_TEMP/reorder-candidate.log"
          cargo bench -p shiv-api --bench catalog \
            -- --warm-up-time 2 --measurement-time 2 --baseline-lenient push \
            | tee "$RUNNER_TEMP/catalog-candidate.log"
      - name: Post the bench diff, failing regressed benches beyond +25%
        run: >
          python3 scripts/bench_diff_summary.py
          --base "$RUNNER_TEMP/reorder-base.log" "$RUNNER_TEMP/catalog-base.log"
          --candidate "$RUNNER_TEMP/reorder-candidate.log" "$RUNNER_TEMP/catalog-candidate.log"
          --base-ref "$BENCH_BASE" --head-ref "$BENCH_HEAD"
      - name: Allocation gates
        run: cargo test -p shiv-core --test alloc_ceilings --test interchange_import_peak
