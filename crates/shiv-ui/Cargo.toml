[package]
name = "shiv-ui"
version = "0.7.0"
edition = "2024"
license = "GPL-3.0"
repository = "https://github.com/luxus/shiv"
homepage = "https://github.com/luxus/shiv"

[[bin]]
name = "shiv"
path = "src/main.rs"

[features]
# Developer probe for screenshots and memory measurements in release builds
# (see `browse::dev_probe`). Never part of a normal build.
dev-probe = []

[dependencies]
shiv-api = { path = "../shiv-api" }
shiv-core = { path = "../shiv-core" }
shiv-repair = { path = "../shiv-repair" }
# Software renderer only (docs/toolkit.md): no GPU stack is linked, so the
# winit backend picks it without SLINT_BACKEND.
slint = { version = "1.18.1", default-features = false, features = [
    "std",
    "compat-1-2",
    "backend-winit",
    "backend-winit-wayland",
    # Window event hook for file drag and drop (src/dnd.rs).
    "unstable-winit-030",
    # Pre-warm fontconfig fallback families off the UI thread (src/main.rs).
    "unstable-fontique-011",
    "renderer-software",
] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }
tempfile = "3.27.0"
# System file dialog for installing a mod from a local file. Pinned to the
# audited Linux backends (rfd's default): the freedesktop portal plus the
# native Wayland dialog, no GTK.
rfd = { version = "0.18", default-features = false, features = [
    "xdg-portal",
    "wayland",
] }

# malloc_trim and mallopt: hand freed memory (Performance, Repair, thumbnails) back to the OS.
[target.'cfg(all(target_os = "linux", target_env = "gnu"))'.dependencies]
libc = "0.2.191"

# Native Wayland file drops (src/dnd/wayland.rs): winit 0.30 has none, so
# Shiv binds its own wl_data_device on winit's connection. Same versions as winit.
[target.'cfg(all(unix, not(target_vendor = "apple")))'.dependencies]
wayland-client = "0.31.10"
wayland-backend = { version = "0.3.10", features = ["client_system"] }
raw-window-handle = "0.6"

[build-dependencies]
slint-build = "1.18.1"

# Icon and version info embedded in shiv.exe.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
# Headless Slint platform for driving the UI in tests (same version as slint).
i-slint-backend-testing = { version = "=1.18.1", default-features = false, features = ["renderer-software"] }
tiny_http = "0.12.0"
# Builds repair fixtures (compiled game data packed into VPKs) in tests.
vpkmanager = { path = "../vpkmanager" }
