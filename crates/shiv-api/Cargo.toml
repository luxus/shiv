[package]
name = "shiv-api"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"
repository = "https://github.com/luxus/shiv"
homepage = "https://github.com/luxus/shiv"

[lib]
name = "shiv_api"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2"
ureq = { version = "3.5.1", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3.27.0"
tiny_http = "0.12.0"
# The catalog bench (docs/perf-results.md, issue #4); plotters/rayon stay
# out — the console numbers and saved baselines are all the suite needs.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "catalog"
harness = false
