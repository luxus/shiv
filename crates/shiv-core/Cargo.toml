[package]
name = "shiv-core"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0"

[lib]
name = "shiv_core"
path = "src/lib.rs"

[dependencies]
steamlocate = "2.0.1"
regex = { version = "1", default-features = false, features = ["std", "unicode-case"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
sha2 = "0.10"
kv-parser = { path = "../kv-parser" }
vpk-parser = { path = "../vpk-parser" }
# Reading mod archives only: no zopfli/lzma encoders, no zip AES (there is
# no password UI), no zip timestamps, no zstd/xz-in-zip. deflate arrives via
# flate2/zlib-rs; deflate64, bzip2, lzma and ppmd cover what 7-Zip and
# WinRAR can put in a zip.
zip = { version = "6.0.0", default-features = false, features = [
    "deflate-flate2-zlib-rs",
    "deflate64",
    "bzip2",
    "lzma",
    "ppmd",
] }
# CompLock's pack parts arrive as raw-DEFLATE streams (zlib wbits=-15):
# the same flate2/zlib-rs build zip already compiles in, so this adds no
# code to the binary, only names the dependency shiv-core now uses itself.
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
unrar = "0.5.8"
# Reading only: `compress` is the lzma encoder and `util` the
# extract-to-path helpers; `aes256` cannot help without a password UI
# (Password::empty()). LZMA/LZMA2 decode is core; bzip2 and ppmd are the
# methods a 7-Zip writer can pick.
sevenz-rust2 = { version = "0.21.4", default-features = false, features = [
    "bzip2",
    "ppmd",
] }
md-5 = "0.10"
rquickjs = { version = "0.14.0", features = ["array-buffer"] }
symphonia = { version = "0.5.5", default-features = false, features = ["mp3", "wav", "flac", "ogg", "vorbis", "pcm"] }

[dev-dependencies]
# Writes real VPKs (with inner paths) for the update-matching tests.
vpkmanager = { path = "../vpkmanager" }
tempfile = "3"
crc32fast = "1"
# Builds the 7z fixtures the install tests read back; resolver 3 keeps the
# encoder out of the shipped binary, which only reads archives.
sevenz-rust2 = { version = "0.21.4", default-features = false, features = [
    "compress",
] }
# The reorder bench (docs/perf-results.md, issue #4); plotters/rayon stay
# out — the console numbers and saved baselines are all the suite needs.
criterion = { version = "0.8", default-features = false, features = [
    "cargo_bench_support",
] }

[[bench]]
name = "reorder"
harness = false
